<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tambunting Ticket Desk</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#20418F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=18">
</head>
<body>

<!-- ===================== AUTH SCREEN ===================== -->
<div id="auth-screen" class="auth-screen">
  <svg class="auth-panel-art" viewBox="0 0 520 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <!-- ambient circuit dots -->
    <circle cx="70" cy="330" r="2.5" fill="rgba(245,242,233,.35)"/>
    <circle cx="460" cy="120" r="2.5" fill="rgba(245,242,233,.3)"/>
    <circle cx="480" cy="260" r="2" fill="rgba(245,242,233,.3)"/>
    <circle cx="40" cy="500" r="2" fill="rgba(245,242,233,.3)"/>
    <circle cx="380" cy="560" r="2.5" fill="rgba(245,242,233,.3)"/>

    <!-- routing lines: branch -> hub -> specialist -->
    <path d="M110 128 C 190 170, 230 220, 292 288" fill="none" stroke="rgba(245,242,233,.5)" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
    <path d="M320 322 C 365 380, 395 420, 424 458" fill="none" stroke="rgba(245,242,233,.5)" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>

    <!-- node: branch device (monitor) -->
    <circle cx="110" cy="118" r="38" fill="rgba(245,242,233,.06)" stroke="rgba(245,242,233,.45)" stroke-width="2"/>
    <rect x="92" y="102" width="36" height="24" rx="1" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2"/>
    <line x1="104" y1="130" x2="116" y2="130" stroke="rgba(255,255,255,.7)" stroke-width="2" stroke-linecap="round"/>
    <line x1="110" y1="126" x2="110" y2="130" stroke="rgba(255,255,255,.7)" stroke-width="2" stroke-linecap="round"/>

    <!-- node: routing hub -->
    <circle cx="306" cy="305" r="52" fill="rgba(245,242,233,.06)" stroke="rgba(245,242,233,.5)" stroke-width="2"/>
    <g stroke="rgba(255,255,255,.65)" stroke-width="2" stroke-linecap="round">
      <line x1="306" y1="277" x2="306" y2="333"/>
      <line x1="278" y1="305" x2="334" y2="305"/>
      <line x1="286" y1="285" x2="326" y2="325"/>
      <line x1="326" y1="285" x2="286" y2="325"/>
    </g>
    <circle cx="306" cy="305" r="5" fill="rgba(127,160,224,.9)"/>

    <!-- floating ticket badge, mid-route -->
    <g transform="translate(352 246) rotate(-14)">
      <rect x="0" y="0" width="46" height="34" rx="2" fill="rgba(246,243,234,.96)" stroke="rgba(32,65,143,.5)" stroke-width="1.5"/>
      <path d="M10 18 L16 24 L28 10" fill="none" stroke="#20418F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- node: IT specialist (headset) -->
    <circle cx="440" cy="470" r="38" fill="rgba(245,242,233,.06)" stroke="rgba(245,242,233,.45)" stroke-width="2"/>
    <path d="M424 470 a16 16 0 0 1 32 0" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="420" y="468" width="7" height="14" rx="1.5" fill="rgba(255,255,255,.7)"/>
    <rect x="453" y="468" width="7" height="14" rx="1.5" fill="rgba(255,255,255,.7)"/>
    <line x1="460" y1="479" x2="460" y2="488" stroke="rgba(255,255,255,.7)" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="452" y1="488" x2="460" y2="488" stroke="rgba(255,255,255,.7)" stroke-width="2.4" stroke-linecap="round"/>
  </svg>

  <div class="auth-center">
    <div class="auth-wordmark">
      <img class="brand-mark small" src="/logo.png" alt="Tambunting Pawnshop">
      <span>Ticket Desk</span>
    </div>
    <div class="auth-card-shell">
      <svg class="auth-mascot" viewBox="0 0 60 104" aria-hidden="true">
        <defs>
          <linearGradient id="mascotShirt" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5B82CC"/>
            <stop offset="100%" stop-color="var(--accent)"/>
          </linearGradient>
          <linearGradient id="mascotSkin" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#F2CDA4"/>
            <stop offset="100%" stop-color="#DDAE81"/>
          </linearGradient>
          <linearGradient id="mascotPants" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4A473D"/>
            <stop offset="100%" stop-color="#2E2C26"/>
          </linearGradient>
          <clipPath id="mascotHairClip"><rect x="0" y="0" width="60" height="19"/></clipPath>
        </defs>

        <!-- back leg (trousers) + shoe -->
        <rect class="mascot-part mascot-leg-back" x="19" y="68" width="9" height="25" rx="3" fill="url(#mascotPants)"/>
        <rect class="mascot-part" x="16" y="91" width="14" height="6" rx="2" fill="var(--ink-950)"/>
        <!-- front leg (trousers) + shoe -->
        <rect class="mascot-part mascot-leg-front" x="31" y="68" width="9" height="25" rx="3" fill="url(#mascotPants)"/>
        <rect class="mascot-part" x="29" y="91" width="14" height="6" rx="2" fill="var(--ink-950)"/>

        <!-- laptop bag, slung at his side -->
        <rect class="mascot-part" x="4" y="46" width="16" height="21" rx="3" fill="var(--accent-dark)" stroke="var(--ink-950)" stroke-width="1"/>
        <rect class="mascot-part" x="7" y="50" width="10" height="3" rx="1.5" fill="var(--accent-ink)" opacity=".8"/>

        <!-- back arm, swung behind -->
        <rect class="mascot-part mascot-arm-back" x="13" y="45" width="8" height="20" rx="4" fill="url(#mascotShirt)"/>

        <!-- torso: collared polo shirt -->
        <rect class="mascot-part" x="16" y="40" width="26" height="30" rx="9" fill="url(#mascotShirt)"/>
        <!-- bag strap crossing the chest -->
        <path class="mascot-part" d="M14 42 L26 44 L18 66" fill="none" stroke="var(--ink-900)" stroke-width="2.5" stroke-linecap="round"/>
        <!-- shirt collar -->
        <path class="mascot-part" d="M23 40 L29 46 L25 40 Z" fill="var(--accent-ink)"/>
        <path class="mascot-part" d="M35 40 L29 46 L33 40 Z" fill="var(--accent-ink)"/>
        <!-- ID badge on a lanyard -->
        <line class="mascot-part" x1="29" y1="43" x2="29" y2="52" stroke="var(--ink-400)" stroke-width="1.5"/>
        <rect class="mascot-part" x="25" y="52" width="8" height="10" rx="1.5" fill="var(--surface-raised)" stroke="var(--accent)" stroke-width="1"/>
        <circle class="mascot-part" cx="29" cy="55" r="1.6" fill="var(--ink-400)"/>

        <!-- front arm, reaching forward to push the card -->
        <rect class="mascot-part mascot-arm-front" x="38" y="48" width="19" height="8" rx="4" fill="url(#mascotShirt)"/>
        <circle class="mascot-part" cx="57" cy="52" r="4.5" fill="url(#mascotSkin)"/>

        <!-- neck -->
        <rect class="mascot-part" x="25" y="33" width="8" height="9" rx="2" fill="url(#mascotSkin)"/>

        <!-- head -->
        <circle class="mascot-part" cx="29" cy="23" r="12.5" fill="url(#mascotSkin)"/>
        <!-- ears -->
        <circle class="mascot-part" cx="17" cy="24" r="2.2" fill="#DDAE81"/>
        <circle class="mascot-part" cx="41" cy="24" r="2.2" fill="#DDAE81"/>
        <!-- short, neat hair (a head-sized circle clipped to just the top cap) -->
        <circle class="mascot-part" cx="29" cy="21" r="13.5" fill="var(--ink-950)" clip-path="url(#mascotHairClip)"/>
        <!-- glasses -->
        <circle class="mascot-part" cx="24" cy="24" r="4.4" fill="none" stroke="var(--ink-950)" stroke-width="1.4"/>
        <circle class="mascot-part" cx="35" cy="24" r="4.4" fill="none" stroke="var(--ink-950)" stroke-width="1.4"/>
        <line class="mascot-part" x1="28.3" y1="24" x2="30.7" y2="24" stroke="var(--ink-950)" stroke-width="1.4"/>
        <line class="mascot-part" x1="19.8" y1="22.5" x2="16.5" y2="21.5" stroke="var(--ink-950)" stroke-width="1.2"/>
        <!-- headset -->
        <path class="mascot-part" d="M15 20 a14 14 0 0 1 28 0" fill="none" stroke="var(--ink-600)" stroke-width="1.6"/>
        <rect class="mascot-part" x="12.5" y="19" width="4" height="7" rx="2" fill="var(--ink-600)"/>
        <path class="mascot-part" d="M14.5 25.5 q-2 5 3 6.5" fill="none" stroke="var(--ink-600)" stroke-width="1.3" stroke-linecap="round"/>
        <circle class="mascot-part" cx="17.6" cy="32.2" r="1.4" fill="var(--ink-600)"/>
      </svg>
      <div class="auth-card">
      <div id="login-form">
        <h2>Sign in</h2>
        <p class="muted">Use your Ticket Desk account.</p>
        <div id="login-error" class="form-error hidden"></div>
        <label>Username</label>
        <input id="login-username" type="text" autocomplete="username" placeholder="e.g. branch1">
        <label>Password</label>
        <div class="password-field">
          <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••">
          <button type="button" id="login-password-toggle" class="password-toggle" aria-label="Show password" aria-pressed="false" title="Show password">
            <svg class="eye-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a19.7 19.7 0 0 1-3.17 4.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <button id="login-btn" class="btn btn-primary btn-block">Sign in</button>
      </div>
    </div>
    <div class="app-credit">Developed by IT Department</div>
    </div>
  </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="app-shell" class="app-shell hidden">
  <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img class="brand-mark small" src="/logo.png" alt="Tambunting Pawnshop">
      <span>Ticket Desk</span>
      <button id="sidebar-close-btn" class="sidebar-close-btn" aria-label="Close menu">✕</button>
    </div>
    <nav id="nav-tabs" class="nav-tabs"></nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div id="user-avatar" class="avatar">?</div>
        <div>
          <div id="user-name" class="user-name">-</div>
          <div id="user-role" class="user-role">-</div>
        </div>
      </div>
      <button id="notify-toggle-btn" class="btn btn-ghost btn-block hidden">Enable notifications</button>
      <button id="logout-btn" class="btn btn-ghost btn-block">Log out</button>
      <div class="app-credit sidebar-credit">Developed by IT Department</div>
    </div>
  </aside>

  <main class="main-area">
    <div id="escalation-banner" class="escalation-banner hidden"></div>
    <header class="topbar">
      <div class="topbar-left">
        <button id="menu-toggle-btn" class="menu-toggle-btn" aria-label="Open menu">☰</button>
        <h1 id="page-title">Dashboard</h1>
        <span id="live-clock" class="live-clock"></span>
      </div>
      <div class="topbar-right">
        <div id="topbar-actions"></div>
        <a id="map-link-btn" class="btn btn-primary btn-sm map-link-btn"
           href="https://www.google.com/maps/d/u/0/viewer?mid=18VTD2RYUbzUCLZO-xIOMhJr8QY9H19E&ll=12.341304166247822%2C123.1336738&z=6"
           target="_blank" rel="noopener noreferrer" title="Open map">
          <span class="map-link-icon" aria-hidden="true">📍</span>
          <span class="map-link-label">Map</span>
        </a>
        <div class="notif-wrap">
          <button id="notif-bell-btn" class="notif-bell-btn hidden" aria-label="Notifications" title="Notifications">
            <span class="notif-bell-icon">🔔</span>
            <span id="notif-bell-count" class="notif-count hidden">0</span>
          </button>
          <div id="notif-panel" class="notif-panel hidden">
            <div class="notif-panel-header">Notifications</div>
            <div id="notif-panel-body" class="notif-panel-body">
              <div class="empty-state">No new notifications</div>
            </div>
          </div>
        </div>
      </div>
    </header>
    <div id="view-root" class="view-root"></div>
  </main>
</div>


<!-- ===================== MODAL ===================== -->
<div id="modal-backdrop" class="modal-backdrop hidden">
  <div id="modal-box" class="modal-box"></div>
</div>

<div id="toast" class="toast hidden"></div>

<!-- Big, hard-to-miss popup for brand new ticket assignments. Complements
     (doesn't replace) the OS-level desktop push in sw.js and the quieter
     toast/bell - see showBigAlert() in app.js. -->
<div id="big-alert" class="big-alert hidden">
  <div class="big-alert-card">
    <button type="button" class="big-alert-close" aria-label="Dismiss">✕</button>
    <div class="big-alert-icon">🎫</div>
    <div class="big-alert-text">
      <div class="big-alert-title"></div>
      <div class="big-alert-sub"></div>
    </div>
  </div>
</div>

<script src="app.js?v=52"></script>
</body>
</html>
